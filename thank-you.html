<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Thank you — Stallion Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f4f5f7;color:#111;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.08);max-width:480px;width:100%;padding:2.5rem 2rem 2rem;text-align:center}
.logo{height:40px;width:auto;margin-bottom:1.75rem}
.tick{width:64px;height:64px;border-radius:50%;background:#00b4d8;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
h1{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;letter-spacing:.03em;line-height:1;margin-bottom:.75rem}
p.lead{font-size:1rem;color:#555;line-height:1.6;margin-bottom:1.75rem}
p.lead strong{color:#111}
.btns{display:flex;flex-direction:column;gap:.7rem}
.btn{display:block;padding:.95rem 1rem;border-radius:50px;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:all .2s}
.btn-call{background:#00b4d8;color:#fff}
.btn-call:hover{background:#00cef5}
.btn-home{background:#fff;color:#111;border:2px solid #e3e3e3}
.btn-home:hover{border-color:#00b4d8;color:#00b4d8}
.foot{margin-top:1.5rem;font-size:.78rem;color:#999}
.foot a{color:#00b4d8;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="media/1fdebcdbdd.png" alt="Stallion Services">
    <div class="tick" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Thanks — we've got it!</h1>
    <p class="lead">Your quote request is in. <strong>Luke will text you a price today.</strong><br>Need it sooner? Give us a call.</p>
    <div class="btns">
      <a class="btn btn-call" href="tel:0451528324">📞 Call 0451 528 324</a>
      <a class="btn btn-home" href="/">Back to website</a>
    </div>
    <p class="foot">See our latest work on <a href="https://www.instagram.com/stallion.services/" target="_blank" rel="noopener">Instagram @stallion.services</a></p>
  </main>
<script src="tracking.js"></script>
</body>
</html>
